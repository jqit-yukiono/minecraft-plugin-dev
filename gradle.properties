kotlin.code.style=official

# Gradle の toolchain 自動検出は Homebrew の keg-only JDK(openjdk@25)を
# 見つけられないため、実パスを明示する。
org.gradle.java.installations.paths=/opt/homebrew/Cellar/openjdk@25/25.0.4.1/libexec/openjdk.jdk/Contents/Home

group=info.sk4869.minecraft
version=1.0.0-SNAPSHOT
plugin_main=info.sk4869.minecraft.ExamplePlugin
# 26.x系からは "<version>.build.<N>-stable" 形式に変わった(旧来の -R0.1-SNAPSHOT は
# 1.21.11 まで)。正式版(-stable)のうち26.1.2向けの最新ビルドを指定する。
# 最新確認: https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
paper_api_version=26.1.2.build.74-stable
